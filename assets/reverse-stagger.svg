<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="12" fill="#0f172a"/>
  <text x="100" y="28" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11" letter-spacing="2">REVERSE &amp; STAGGER</text>
  <g transform="translate(15,48)">
    <text x="0" y="12" fill="#64748b" font-family="monospace" font-size="8">PLAY REVERSE</text>
    <g transform="translate(0,20)">
      <rect x="0" y="0" width="30" height="20" rx="3" fill="#ef4444" opacity="0.7">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="34" y="0" width="30" height="20" rx="3" fill="#f97316" opacity="0.7">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="0.8s" repeatCount="indefinite" begin="0.1s"/>
      </rect>
      <rect x="68" y="0" width="30" height="20" rx="3" fill="#f59e0b" opacity="0.7">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="0.8s" repeatCount="indefinite" begin="0.2s"/>
      </rect>
      <polyline points="0,45 24,45 24,35 54,35 54,45 78,45 78,30 108,30" stroke="#a855f7" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
      <text x="54" y="58" text-anchor="middle" fill="#a855f7" font-family="monospace" font-size="7">backward</text>
    </g>
  </g>
  <g transform="translate(15,100)">
    <text x="0" y="12" fill="#64748b" font-family="monospace" font-size="8">STAGGER PLAY</text>
    <g transform="translate(0,22)">
      <rect x="0" y="0" width="20" height="16" rx="2" fill="#22c55e" opacity="0.9">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="24" y="0" width="20" height="16" rx="2" fill="#22c55e" opacity="0.9">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="0.15s"/>
      </rect>
      <rect x="48" y="0" width="20" height="16" rx="2" fill="#22c55e" opacity="0.9">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
      </rect>
      <rect x="72" y="0" width="20" height="16" rx="2" fill="#22c55e" opacity="0.9">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="0.45s"/>
      </rect>
      <rect x="96" y="0" width="20" height="16" rx="2" fill="#22c55e" opacity="0.9">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
      </rect>
    </g>
    <text x="50" y="52" text-anchor="middle" fill="#475569" font-family="monospace" font-size="7">stagger: 100ms</text>
  </g>
  <g transform="translate(15,155)">
    <text x="0" y="10" fill="#64748b" font-family="monospace" font-size="8">RANDOM START</text>
    <circle cx="20" cy="30" r="5" fill="#8b5cf6" opacity="0.8"/>
    <circle cx="45" cy="25" r="5" fill="#8b5cf6" opacity="0.8"/>
    <circle cx="70" cy="32" r="5" fill="#8b5cf6" opacity="0.8"/>
    <text x="45" y="52" text-anchor="middle" fill="#475569" font-family="monospace" font-size="7">randomFrame: true</text>
  </g>
</svg>