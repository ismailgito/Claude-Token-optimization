<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="12" fill="#0f172a"/>
  <text x="100" y="28" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11" letter-spacing="2">PER-FRAME DURATION</text>
  <g transform="translate(15,48)">
    <rect x="0" y="0" width="36" height="40" rx="3" fill="#ef4444" opacity="0.9"/>
    <text x="18" y="55" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="7">punch1</text>
    <text x="18" y="66" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="6">50ms</text>
  </g>
  <g transform="translate(55,48)">
    <rect x="0" y="0" width="36" height="60" rx="3" fill="#f59e0b" opacity="0.9"/>
    <text x="18" y="75" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="7">kick</text>
    <text x="18" y="86" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="6">200ms</text>
  </g>
  <g transform="translate(95,48)">
    <rect x="0" y="0" width="36" height="45" rx="3" fill="#22c55e" opacity="0.9"/>
    <text x="18" y="60" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="7">recover</text>
    <text x="18" y="71" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="6">100ms</text>
  </g>
  <line x1="135" y1="68" x2="160" y2="68" stroke="#64748b" stroke-width="1"/>
  <text x="172" y="72" fill="#475569" font-family="monospace" font-size="7">+ base msPerFrame</text>
  <g transform="translate(15,105)">
    <rect x="0" y="0" width="170" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="85" y="18" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">AnimationConfig</text>
    <text x="20" y="36" fill="#64748b" font-family="monospace" font-size="6">key  frames  frameRate</text>
    <text x="100" y="36" fill="#64748b" font-family="monospace" font-size="6">repeat  delay  yoyo</text>
    <text x="160" y="36" fill="#64748b" font-family="monospace" font-size="6">duration</text>
  </g>
  <g transform="translate(15,160)">
    <rect x="0" y="0" width="170" height="28" rx="5" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
    <text x="85" y="18" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="8">frameRate wins over duration</text>
  </g>
</svg>