<svg width="900" height="250" viewBox="0 0 900 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cfBg" x1="0" y1="0" x2="900" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e0e10"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="cfGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="cfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="250" rx="12" fill="url(#cfBg)"/>

  <text x="450" y="28" text-anchor="middle" font-family="monospace" font-size="11" fill="#d97757" letter-spacing="3" opacity="0.6">ANIMATION CHAINING</text>

  <!-- Chain sequence -->
  <g>
    <!-- Attack -->
    <g filter="url(#cfGlow)">
      <rect x="30" y="55" width="150" height="80" rx="10" fill="#1a1a2e" stroke="#d97757" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
      </rect>
      <text x="105" y="80" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#d97757">attack</text>
      <text x="105" y="96" text-anchor="middle" font-family="monospace" font-size="8" fill="#888">repeat: 0</text>
      <text x="105" y="110" text-anchor="middle" font-family="monospace" font-size="8" fill="#888">8 frames @ 24fps</text>
      <!-- Status indicator -->
      <circle cx="105" cy="126" r="3" fill="#d97757">
        <animate attributeName="r" values="3;5;3" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="0.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Chain arrow -->
    <g>
      <line x1="185" y1="95" x2="225" y2="95" stroke="#d97757" stroke-width="1.5" stroke-dasharray="4 3">
        <animate attributeName="stroke-dashoffset" values="0;-14" dur="1s" repeatCount="indefinite"/>
      </line>
      <polygon points="225,95 215,89 215,101" fill="#d97757"/>
      <text x="205" y="85" text-anchor="middle" font-family="monospace" font-size="7" fill="#d97757" opacity="0.7">.chain()</text>
    </g>

    <!-- Fall -->
    <g filter="url(#cfGlow)">
      <rect x="235" y="55" width="150" height="80" rx="10" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
      <text x="310" y="80" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#f59e0b">fall</text>
      <text x="310" y="96" text-anchor="middle" font-family="monospace" font-size="8" fill="#888">repeat: 0</text>
      <text x="310" y="110" text-anchor="middle" font-family="monospace" font-size="8" fill="#888">4 frames @ 12fps</text>
      <circle cx="310" cy="126" r="3" fill="#f59e0b" opacity="0.3"/>
    </g>

    <!-- Chain arrow -->
    <g>
      <line x1="390" y1="95" x2="430" y2="95" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
      <polygon points="430,95 420,89 420,101" fill="#f59e0b" opacity="0.5"/>
      <text x="410" y="85" text-anchor="middle" font-family="monospace" font-size="7" fill="#f59e0b" opacity="0.5">.chain()</text>
    </g>

    <!-- Land -->
    <g filter="url(#cfGlow)">
      <rect x="440" y="55" width="150" height="80" rx="10" fill="#1a1a2e" stroke="#a3e635" stroke-width="1.5" opacity="0.6"/>
      <text x="515" y="80" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#a3e635">land</text>
      <text x="515" y="96" text-anchor="middle" font-family="monospace" font-size="8" fill="#888">repeat: 0</text>
      <text x="515" y="110" text-anchor="middle" font-family="monospace" font-size="8" fill="#888">3 frames @ 12fps</text>
      <circle cx="515" cy="126" r="3" fill="#a3e635" opacity="0.3"/>
    </g>

    <!-- Chain arrow -->
    <g>
      <line x1="595" y1="95" x2="635" y2="95" stroke="#a3e635" stroke-width="1.5" stroke-dasharray="4 3"/>
      <polygon points="635,95 625,89 625,101" fill="#a3e635" opacity="0.5"/>
      <text x="615" y="85" text-anchor="middle" font-family="monospace" font-size="7" fill="#a3e635" opacity="0.5">.chain()</text>
    </g>

    <!-- Idle (looping) -->
    <g filter="url(#cfGlow)">
      <rect x="645" y="55" width="150" height="80" rx="10" fill="#1a1a2e" stroke="#06b6d4" stroke-width="1.5" opacity="0.6"/>
      <text x="720" y="80" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#06b6d4">idle</text>
      <text x="720" y="96" text-anchor="middle" font-family="monospace" font-size="8" fill="#888">repeat: -1</text>
      <text x="720" y="110" text-anchor="middle" font-family="monospace" font-size="8" fill="#888">loops forever</text>
      <!-- Infinity symbol for loop -->
      <text x="720" y="128" text-anchor="middle" font-family="monospace" font-size="10" fill="#06b6d4" opacity="0.5">&#8734;</text>
    </g>
  </g>

  <!-- Timeline -->
  <g transform="translate(30, 160)">
    <rect width="765" height="3" rx="1.5" fill="#d97757" opacity="0.15"/>
    <rect width="0" height="3" rx="1.5" fill="url(#cfGrad)">
      <animate attributeName="width" values="0;765;0" dur="8s" repeatCount="indefinite"/>
    </rect>
    <!-- Time markers -->
    <text x="0" y="18" font-family="monospace" font-size="7" fill="#666">0ms</text>
    <text x="190" y="18" font-family="monospace" font-size="7" fill="#666">~500ms</text>
    <text x="380" y="18" font-family="monospace" font-size="7" fill="#666">~900ms</text>
    <text x="520" y="18" font-family="monospace" font-size="7" fill="#666">~1200ms</text>
    <text x="645" y="18" font-family="monospace" font-size="7" fill="#666">~1500ms</text>
  </g>

  <!-- Code snippet -->
  <g transform="translate(30, 200)">
    <rect width="765" height="40" rx="6" fill="#ffffff" opacity="0.03" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="4 4"/>
    <text x="15" y="18" font-family="monospace" font-size="9" fill="#d97757">sprite.play('attack');</text>
    <text x="230" y="18" font-family="monospace" font-size="9" fill="#f59e0b">sprite.chain('fall');</text>
    <text x="390" y="18" font-family="monospace" font-size="9" fill="#a3e635">sprite.chain('land');</text>
    <text x="545" y="18" font-family="monospace" font-size="9" fill="#06b6d4">sprite.chain('idle');</text>
    <text x="15" y="33" font-family="monospace" font-size="8" fill="#666">// Chained anims start after animationcomplete or animationstop</text>
  </g>
</svg>
