<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="12" fill="#0f172a"/>
  <text x="100" y="28" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11" letter-spacing="2">WALK CYCLE</text>
  <g transform="translate(100,100)">
    <ellipse cx="0" cy="-30" rx="10" ry="14" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="-4" y="-18" width="8" height="16" rx="2" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-15,4,-12;15,4,-12;-15,4,-12" dur="0.6s" repeatCount="indefinite"/>
      <line x1="4" y1="-12" x2="10" y2="0" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="10" cy="1" r="2.5" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="15,-4,-12;-15,-4,-12;15,-4,-12" dur="0.6s" repeatCount="indefinite"/>
      <line x1="-4" y1="-12" x2="-10" y2="0" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-10" cy="1" r="2.5" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
    </g>
    <rect x="-7" y="2" width="5" height="14" rx="1.5" fill="#3b82f6"/>
    <rect x="2" y="2" width="5" height="14" rx="1.5" fill="#3b82f6"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="10,-7,2;-10,-7,2;10,-7,2" dur="0.6s" repeatCount="indefinite"/>
      <line x1="-7" y1="2" x2="-13" y2="14" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-13" cy="14" r="2" fill="#60a5fa"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-10,2,2;10,2,2;-10,2,2" dur="0.6s" repeatCount="indefinite"/>
      <line x1="2" y1="2" x2="8" y2="14" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="8" cy="14" r="2" fill="#60a5fa"/>
    </g>
    <circle cx="0" cy="-42" r="5" fill="#f87171" opacity="0.3">
      <animate attributeName="r" values="5;10;5" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="100" y="175" text-anchor="middle" fill="#475569" font-family="monospace" font-size="9">sprite.play('walk')</text>
</svg>