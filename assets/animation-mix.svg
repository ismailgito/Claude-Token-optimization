<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="12" fill="#0f172a"/>
  <text x="100" y="28" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11" letter-spacing="2">ANIM MIXING</text>
  <g transform="translate(25,60)">
    <rect x="0" y="0" width="55" height="40" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="27" y="25" text-anchor="middle" fill="#a5b4fc" font-family="monospace" font-size="10" font-weight="bold">IDLE</text>
  </g>
  <line x1="80" y1="80" x2="110" y2="80" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,3">
    <animate attributeName="stroke-dashoffset" values="0;14" dur="1s" repeatCount="indefinite"/>
  </line>
  <text x="95" y="73" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="7">200ms</text>
  <g transform="translate(115,60)">
    <rect x="0" y="0" width="55" height="40" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <text x="27" y="25" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="10" font-weight="bold">WALK</text>
  </g>
  <g transform="translate(25,125)">
    <rect x="0" y="0" width="55" height="40" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <text x="27" y="25" text-anchor="middle" fill="#f9a8d4" font-family="monospace" font-size="10" font-weight="bold">RUN</text>
  </g>
  <line x1="80" y1="145" x2="110" y2="145" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,3">
    <animate attributeName="stroke-dashoffset" values="0;14" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <text x="95" y="138" text-anchor="middle" fill="#f9a8d4" font-family="monospace" font-size="7">300ms</text>
  <g transform="translate(115,125)">
    <rect x="0" y="0" width="55" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="27" y="25" text-anchor="middle" fill="#fcd34d" font-family="monospace" font-size="10" font-weight="bold">JUMP</text>
  </g>
  <g transform="translate(40,180)">
    <rect x="-50" y="-8" width="100" height="16" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="0" y="3" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="7">addMix() / removeMix()</text>
  </g>
  <text x="100" y="50" text-anchor="middle" fill="#475569" font-family="monospace" font-size="7">global transitions</text>
  <text x="100" y="190" text-anchor="middle" fill="#475569" font-family="monospace" font-size="7">only works with sprite.play()</text>
</svg>