<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="12" fill="#0f172a"/>
  <text x="100" y="28" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11" letter-spacing="2">EVENTS FLOW</text>
  <g transform="translate(20,50)">
    <rect x="0" y="0" width="60" height="30" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="30" y="20" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="9">start</text>
  </g>
  <line x1="80" y1="65" x2="110" y2="65" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <g transform="translate(115,50)">
    <rect x="0" y="0" width="65" height="30" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="32" y="20" text-anchor="middle" fill="#3b82f6" font-family="monospace" font-size="8">update</text>
  </g>
  <line x1="180" y1="65" x2="190" y2="65" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="190" y1="65" x2="190" y2="120" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="190" y1="120" x2="160" y2="120" stroke="#3b82f6" stroke-width="1.5"/>
  <g transform="translate(30,100)">
    <rect x="0" y="0" width="70" height="30" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="35" y="20" text-anchor="middle" fill="#a855f7" font-family="monospace" font-size="8">repeat</text>
  </g>
  <line x1="100" y1="115" x2="130" y2="115" stroke="#a855f7" stroke-width="1.5"/>
  <g transform="translate(135,100)">
    <rect x="0" y="0" width="65" height="30" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="32" y="20" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="8">complete</text>
  </g>
  <path d="M165,130 L165,155 L20,155 L20,90" stroke="#64748b" stroke-width="1" stroke-dasharray="4,4" fill="none"/>
  <g transform="translate(20,160)">
    <rect x="0" y="0" width="60" height="30" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="30" y="20" text-anchor="middle" fill="#ec4899" font-family="monospace" font-size="8">stop</text>
  </g>
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22c55e"/>
    </marker>
  </defs>
  <text x="100" y="190" text-anchor="middle" fill="#475569" font-family="monospace" font-size="7">sprite.on('event', callback)</text>
