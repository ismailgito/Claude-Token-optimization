<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="12" fill="#0f172a"/>
  <text x="100" y="28" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11" letter-spacing="2">GLOBAL vs LOCAL</text>
  <g transform="translate(15,45)">
    <rect x="0" y="0" width="80" height="28" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="40" y="19" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="9">GLOBAL</text>
  </g>
  <g transform="translate(15,82)">
    <circle cx="10" cy="10" r="6" fill="#22c55e" opacity="0.3">
      <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="25" cy="5" r="5" fill="#22c55e" opacity="0.3">
      <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="40" cy="10" r="6" fill="#22c55e" opacity="0.3">
      <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="55" cy="5" r="5" fill="#22c55e" opacity="0.3">
      <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
    <circle cx="70" cy="10" r="6" fill="#22c55e" opacity="0.3">
      <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <text x="40" y="30" text-anchor="middle" fill="#475569" font-family="monospace" font-size="7">all sprites</text>
  </g>
  <g transform="translate(15,120)">
    <rect x="0" y="0" width="80" height="28" rx="5" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="40" y="19" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="9">LOCAL</text>
  </g>
  <g transform="translate(15,155)">
    <circle cx="40" cy="10" r="8" fill="#f59e0b" opacity="0.6"/>
    <text x="40" y="30" text-anchor="middle" fill="#475569" font-family="monospace" font-size="7">one sprite</text>
  </g>
  <g transform="translate(115,60)">
    <rect x="0" y="0" width="75" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="37" y="18" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">this.anims</text>
    <text x="37" y="32" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="7">create()</text>
    <text x="37" y="44" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="7">singleton</text>
  </g>
  <g transform="translate(115,120)">
    <rect x="0" y="0" width="75" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="37" y="18" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="8">sprite.anims</text>
    <text x="37" y="32" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="7">create()</text>
    <text x="37" y="44" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="7">per-instance</text>
  </g>
</svg>