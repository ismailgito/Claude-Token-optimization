<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="amBg" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e0e10"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="amGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="amShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#d97757" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="400" rx="12" fill="url(#amBg)"/>

  <!-- Section labels -->
  <text x="400" y="30" text-anchor="middle" font-family="monospace" font-size="11" fill="#d97757" letter-spacing="3" opacity="0.6">ANIMATION ARCHITECTURE</text>

  <!-- AnimationManager (Global) box -->
  <g filter="url(#amShadow)">
    <rect x="40" y="50" width="340" height="180" rx="12" fill="#1a1a2e" stroke="#d97757" stroke-width="1.5" opacity="0.9"/>
    <rect x="40" y="50" width="340" height="32" rx="12" fill="#d97757" opacity="0.1"/>
    <text x="210" y="72" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#d97757">AnimationManager</text>
    <text x="210" y="92" text-anchor="middle" font-family="monospace" font-size="9" fill="#888">this.anims  |  Global Singleton</text>

    <!-- Animation definitions inside -->
    <rect x="60" y="105" width="80" height="24" rx="6" fill="#d97757" opacity="0.1" stroke="#d97757" stroke-width="1" stroke-dasharray="3 2">
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="100" y="121" text-anchor="middle" font-family="monospace" font-size="9" fill="#d97757">'walk'</text>

    <rect x="160" y="105" width="80" height="24" rx="6" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 2">
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="200" y="121" text-anchor="middle" font-family="monospace" font-size="9" fill="#f59e0b">'idle'</text>

    <rect x="260" y="105" width="100" height="24" rx="6" fill="#a3e635" opacity="0.1" stroke="#a3e635" stroke-width="1" stroke-dasharray="3 2">
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <text x="310" y="121" text-anchor="middle" font-family="monospace" font-size="9" fill="#a3e635">'attack'</text>

    <!-- Shared across scenes -->
    <rect x="60" y="145" width="300" height="60" rx="8" fill="#ffffff" opacity="0.03" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="4 4"/>
    <text x="210" y="165" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">Shared across all Scenes</text>
    <text x="210" y="180" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">create | remove | get | exists</text>
    <text x="210" y="195" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">generateFrame* | play | staggerPlay</text>
  </g>

  <!-- Connecting arrows -->
  <g filter="url(#amGlow)">
    <!-- Arrow to Sprite 1 -->
    <path d="M210 230 L210 260 L160 260 L160 280" stroke="#d97757" stroke-width="1.5" fill="none" stroke-dasharray="4 3" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <polygon points="160,280 155,270 165,270" fill="#d97757" opacity="0.6"/>

    <!-- Arrow to Sprite 2 -->
    <path d="M210 230 L210 260 L320 260 L320 280" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="4 3" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
    </path>
    <polygon points="320,280 315,270 325,270" fill="#f59e0b" opacity="0.6"/>

    <!-- Arrow to Sprite 3 -->
    <path d="M210 230 L210 260 L480 260 L480 280" stroke="#a3e635" stroke-width="1.5" fill="none" stroke-dasharray="4 3" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
    </path>
    <polygon points="480,280 475,270 485,270" fill="#a3e635" opacity="0.6"/>
  </g>

  <!-- Sprite 1 (AnimationState) -->
  <g filter="url(#amShadow)">
    <rect x="80" y="280" width="160" height="100" rx="10" fill="#1a1a2e" stroke="#d97757" stroke-width="1.5"/>
    <rect x="80" y="280" width="160" height="26" rx="10" fill="#d97757" opacity="0.1"/>
    <text x="160" y="298" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#d97757">sprite.anims</text>
    <text x="160" y="318" text-anchor="middle" font-family="monospace" font-size="8" fill="#888">AnimationState</text>
    <text x="160" y="335" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">play | stop | pause</text>
    <text x="160" y="350" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">chain | reverse</text>
    <circle cx="160" cy="370" r="4" fill="#d97757">
      <animate attributeName="r" values="4;6;4" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Sprite 2 (AnimationState) -->
  <g filter="url(#amShadow)">
    <rect x="240" y="280" width="160" height="100" rx="10" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="240" y="280" width="160" height="26" rx="10" fill="#f59e0b" opacity="0.1"/>
    <text x="320" y="298" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#f59e0b">enemy.anims</text>
    <text x="320" y="318" text-anchor="middle" font-family="monospace" font-size="8" fill="#888">AnimationState</text>
    <text x="320" y="335" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">play | stop | pause</text>
    <text x="320" y="350" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">chain | reverse</text>
    <circle cx="320" cy="370" r="4" fill="#f59e0b">
      <animate attributeName="r" values="4;6;4" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Sprite 3 (local override) -->
  <g filter="url(#amShadow)">
    <rect x="400" y="280" width="160" height="100" rx="10" fill="#1a1a2e" stroke="#a3e635" stroke-width="1.5"/>
    <rect x="400" y="280" width="160" height="26" rx="10" fill="#a3e635" opacity="0.1"/>
    <text x="480" y="298" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#a3e635">boss.anims</text>
    <text x="480" y="318" text-anchor="middle" font-family="monospace" font-size="8" fill="#888">AnimationState (local)</text>
    <text x="480" y="335" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">overrides global key</text>
    <text x="480" y="350" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">'walk' = custom anim</text>
    <circle cx="480" cy="370" r="4" fill="#a3e635">
      <animate attributeName="r" values="4;6;4" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Legend -->
  <g transform="translate(600, 60)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#d97757" letter-spacing="1">LEGEND</text>
    <rect x="0" y="12" width="12" height="12" rx="3" fill="#d97757" opacity="0.2" stroke="#d97757" stroke-width="1"/>
    <text x="20" y="22" font-family="monospace" font-size="9" fill="#888">Global Animation</text>
    <rect x="0" y="32" width="12" height="12" rx="3" fill="#d97757" opacity="0.4" stroke="#d97757" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="20" y="42" font-family="monospace" font-size="9" fill="#888">Registered Definition</text>
    <rect x="0" y="52" width="12" height="12" rx="3" fill="#a3e635" opacity="0.2" stroke="#a3e635" stroke-width="1"/>
    <text x="20" y="62" font-family="monospace" font-size="9" fill="#888">Local Override</text>
    <line x1="0" y1="80" x2="12" y2="80" stroke="#d97757" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="20" y="84" font-family="monospace" font-size="9" fill="#888">Falls back to global</text>

    <!-- Scope indicator -->
    <rect x="0" y="100" width="200" height="80" rx="8" fill="#ffffff" opacity="0.02" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="4 4"/>
    <text x="100" y="120" text-anchor="middle" font-family="monospace" font-size="8" fill="#555">Scope Priority</text>
    <text x="100" y="138" text-anchor="middle" font-family="monospace" font-size="9" fill="#d97757">Local {'>'} Global</text>
    <text x="100" y="155" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">sprite.anims.create()</text>
    <text x="100" y="168" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">overrides this.anims.create()</text>
  </g>
</svg>
