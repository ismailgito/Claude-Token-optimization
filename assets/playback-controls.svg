<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="12" fill="#0f172a"/>
  <text x="100" y="28" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11" letter-spacing="2">PLAYBACK CONTROLS</text>
  <g transform="translate(100,90)">
    <circle cx="0" cy="0" r="36" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <polygon points="-12,-16 -12,16 14,0" fill="#22c55e" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <rect x="-28" y="-28" width="56" height="56" rx="28" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.3">
      <animate attributeName="r" values="28;32;28" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(55,140)">
    <circle cx="0" cy="0" r="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="-5" y="-7" width="3" height="14" rx="1" fill="#f59e0b"/>
    <rect x="1" y="-7" width="3" height="14" rx="1" fill="#f59e0b"/>
  </g>
  <g transform="translate(145,140)">
    <circle cx="0" cy="0" r="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="-7" y="-7" width="14" height="14" rx="2" fill="#ef4444"/>
  </g>
  <g transform="translate(100,175)">
    <rect x="-30" y="-8" width="60" height="16" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="-26" y="-4" width="0" height="8" rx="4" fill="#3b82f6">
      <animate attributeName="width" values="0;52;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="1" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="7">timeScale</text>
  </g>
  <text x="100" y="62" text-anchor="middle" fill="#475569" font-family="monospace" font-size="8">play / pause / stop</text>
  <g transform="translate(100,118)">
    <rect x="-40" y="-6" width="80" height="12" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <circle cx="-30" cy="0" r="3" fill="#22c55e"/>
    <circle cx="0" cy="0" r="3" fill="#f59e0b"/>
    <circle cx="30" cy="0" r="3" fill="#ef4444"/>
  </g>
</svg>