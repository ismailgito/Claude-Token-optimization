<svg width="960" height="320" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="960" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e0e10"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="glowAccent" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0"/>
      <stop offset="30%" stop-color="#d97757"/>
      <stop offset="70%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="heroGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#d97757" flood-opacity="0.2"/>
    </filter>
    <clipPath id="gridClip">
      <rect width="960" height="320"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="960" height="320" rx="16" fill="url(#heroBg)"/>

  <!-- Animated grid lines -->
  <g clip-path="url(#gridClip)" opacity="0.06">
    <line x1="0" y1="0" x2="0" y2="320" stroke="#d97757" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0;96,0;0,0" dur="20s" repeatCount="indefinite"/>
    </line>
    <line x1="96" y1="0" x2="96" y2="320" stroke="#d97757" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0;96,0;0,0" dur="20s" repeatCount="indefinite"/>
    </line>
    <line x1="192" y1="0" x2="192" y2="320" stroke="#d97757" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0;96,0;0,0" dur="20s" repeatCount="indefinite"/>
    </line>
    <line x1="288" y1="0" x2="288" y2="320" stroke="#d97757" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0;96,0;0,0" dur="20s" repeatCount="indefinite"/>
    </line>
    <line x1="384" y1="0" x2="384" y2="320" stroke="#d97757" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0;96,0;0,0" dur="20s" repeatCount="indefinite"/>
    </line>
    <line x1="480" y1="0" x2="480" y2="320" stroke="#d97757" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0;96,0;0,0" dur="20s" repeatCount="indefinite"/>
    </line>
    <line x1="576" y1="0" x2="576" y2="320" stroke="#d97757" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0;96,0;0,0" dur="20s" repeatCount="indefinite"/>
    </line>
    <line x1="672" y1="0" x2="672" y2="320" stroke="#d97757" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0;96,0;0,0" dur="20s" repeatCount="indefinite"/>
    </line>
    <line x1="768" y1="0" x2="768" y2="320" stroke="#d97757" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0;96,0;0,0" dur="20s" repeatCount="indefinite"/>
    </line>
    <line x1="864" y1="0" x2="864" y2="320" stroke="#d97757" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0;96,0;0,0" dur="20s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Animated spritesheet frames row -->
  <g filter="url(#softShadow)">
    <!-- Frame 1 -->
    <rect x="60" y="90" width="72" height="72" rx="8" fill="#1a1a2e" stroke="url(#frameGrad)" stroke-width="1.5" opacity="0.8"/>
    <rect x="72" y="102" width="48" height="6" rx="3" fill="#d97757" opacity="0.3"/>
    <rect x="72" y="114" width="36" height="4" rx="2" fill="#d97757" opacity="0.2"/>
    <rect x="72" y="124" width="42" height="4" rx="2" fill="#d97757" opacity="0.15"/>
    <rect x="72" y="134" width="30" height="4" rx="2" fill="#d97757" opacity="0.1"/>
    <text x="96" y="158" text-anchor="middle" font-family="monospace" font-size="8" fill="#d97757" opacity="0.5">frame 0</text>

    <!-- Frame 2 -->
    <rect x="148" y="85" width="72" height="72" rx="8" fill="#1a1a2e" stroke="url(#frameGrad)" stroke-width="1.5" opacity="0.9"/>
    <rect x="160" y="97" width="48" height="6" rx="3" fill="#d97757" opacity="0.4"/>
    <rect x="160" y="109" width="36" height="4" rx="2" fill="#d97757" opacity="0.25"/>
    <rect x="160" y="119" width="42" height="4" rx="2" fill="#d97757" opacity="0.2"/>
    <rect x="160" y="129" width="30" height="4" rx="2" fill="#d97757" opacity="0.15"/>
    <text x="184" y="153" text-anchor="middle" font-family="monospace" font-size="8" fill="#d97757" opacity="0.6">frame 1</text>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="2s" repeatCount="indefinite"/>

    <!-- Frame 3 (active) -->
    <rect x="236" y="80" width="72" height="72" rx="8" fill="#1a1a2e" stroke="#d97757" stroke-width="2" opacity="1">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="248" y="92" width="48" height="6" rx="3" fill="#d97757" opacity="0.7"/>
    <rect x="248" y="104" width="36" height="4" rx="2" fill="#d97757" opacity="0.4"/>
    <rect x="248" y="114" width="42" height="4" rx="2" fill="#d97757" opacity="0.35"/>
    <rect x="248" y="124" width="30" height="4" rx="2" fill="#d97757" opacity="0.25"/>
    <text x="272" y="148" text-anchor="middle" font-family="monospace" font-size="8" fill="#d97757" opacity="0.8">frame 2</text>

    <!-- Frame 4 -->
    <rect x="324" y="85" width="72" height="72" rx="8" fill="#1a1a2e" stroke="url(#frameGrad)" stroke-width="1.5" opacity="0.9"/>
    <rect x="336" y="97" width="48" height="6" rx="3" fill="#d97757" opacity="0.4"/>
    <rect x="336" y="109" width="36" height="4" rx="2" fill="#d97757" opacity="0.25"/>
    <rect x="336" y="119" width="42" height="4" rx="2" fill="#d97757" opacity="0.2"/>
    <rect x="336" y="129" width="30" height="4" rx="2" fill="#d97757" opacity="0.15"/>
    <text x="360" y="153" text-anchor="middle" font-family="monospace" font-size="8" fill="#d97757" opacity="0.6">frame 3</text>

    <!-- Frame 5 -->
    <rect x="412" y="90" width="72" height="72" rx="8" fill="#1a1a2e" stroke="url(#frameGrad)" stroke-width="1.5" opacity="0.8"/>
    <rect x="424" y="102" width="48" height="6" rx="3" fill="#d97757" opacity="0.3"/>
    <rect x="424" y="114" width="36" height="4" rx="2" fill="#d97757" opacity="0.2"/>
    <rect x="424" y="124" width="42" height="4" rx="2" fill="#d97757" opacity="0.15"/>
    <rect x="424" y="134" width="30" height="4" rx="2" fill="#d97757" opacity="0.1"/>
    <text x="448" y="158" text-anchor="middle" font-family="monospace" font-size="8" fill="#d97757" opacity="0.5">frame 4</text>
  </g>

  <!-- Playback progress indicator -->
  <g filter="url(#heroGlow)">
    <rect x="60" y="175" width="424" height="4" rx="2" fill="#d97757" opacity="0.15"/>
    <rect x="60" y="175" width="0" height="4" rx="2" fill="url(#frameGrad)">
      <animate attributeName="width" values="0;424;0" dur="4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="60" cy="177" r="6" fill="#d97757" opacity="0.8">
      <animate attributeName="cx" values="60;484;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title text -->
  <g filter="url(#heroGlow)">
    <text x="540" y="110" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#ffffff" letter-spacing="-1">
      Token
      <tspan fill="#d97757">Optimizer</tspan>
    </text>
    <text x="540" y="145" font-family="Georgia, serif" font-size="16" fill="#a0a0a0" letter-spacing="0.5">
      Frame-by-frame token reduction for LLMs
    </text>
  </g>

  <!-- Animated badge -->
  <g filter="url(#softShadow)">
    <rect x="540" y="165" width="120" height="36" rx="18" fill="#d97757" opacity="0.15" stroke="#d97757" stroke-width="1">
      <animate attributeName="opacity" values="0.15;0.25;0.15" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="600" y="188" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#d97757">
      -72% tokens
    </text>
  </g>

  <!-- Floating particle dots -->
  <circle cx="180" cy="50" r="2" fill="#d97757" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="50;40;50" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="45" r="1.5" fill="#f59e0b" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="cy" values="45;35;45" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="620" cy="55" r="2.5" fill="#d97757" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" dur="2s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="cy" values="55;42;55" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="820" cy="48" r="1.5" fill="#f59e0b" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="3.5s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="cy" values="48;38;48" dur="3.5s" repeatCount="indefinite" begin="1.5s"/>
  </circle>

  <!-- Bottom accent line -->
  <rect x="60" y="300" width="840" height="2" rx="1" fill="url(#glowAccent)">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Play button icon -->
  <g transform="translate(820, 100)" opacity="0.6">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#d97757" stroke-width="1.5" stroke-dasharray="4 3">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="12s" repeatCount="indefinite"/>
    </circle>
    <polygon points="-6,-10 -6,10 10,0" fill="#d97757" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>
