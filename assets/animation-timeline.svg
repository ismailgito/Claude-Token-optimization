<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="12" fill="#0f172a"/>
  <text x="100" y="28" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11" letter-spacing="2">ANIMATION TIMELINE</text>
  <line x1="30" y1="100" x2="170" y2="100" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <g>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
    <circle cx="30" cy="100" r="6" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
    <text x="30" y="82" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="8">start</text>
  </g>
  <circle cx="60" cy="100" r="5" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="82" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="7">f2</text>
  <circle cx="90" cy="100" r="5" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <text x="90" y="82" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="7">f4</text>
  <circle cx="120" cy="100" r="5" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <text x="120" y="82" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="7">f6</text>
  <circle cx="150" cy="100" r="5" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="82" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="7">f8</text>
  <g>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite"/>
    <circle cx="170" cy="100" r="6" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
    <text x="170" y="82" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="8">complete</text>
  </g>
  <rect x="44" y="116" width="82" height="5" rx="2.5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="44" y="116" width="0" height="5" rx="2.5" fill="url(#timelineGrad)">
    <animate attributeName="width" values="0;205;0" dur="2s" repeatCount="indefinite"/>
  </rect>
  <defs>
    <linearGradient id="timelineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <text x="100" y="155" text-anchor="middle" fill="#475569" font-family="monospace" font-size="9">frameRate: 24  repeat: -1</text>
  <g transform="translate(100,172)">
    <rect x="-8" y="-4" width="6" height="8" rx="1" fill="#fbbf24"/>
    <text x="0" y="14" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="7">yoyo</text>
  </g>
  <g transform="translate(130,172)">
    <rect x="-8" y="-4" width="6" height="8" rx="1" fill="#a855f7"/>
    <text x="0" y="14" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="7">delay</text>
  </g>
  <g transform="translate(160,172)">
    <rect x="-8" y="-4" width="6" height="8" rx="1" fill="#ec4899"/>
    <text x="0" y="14" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="7">mix</text>
  </g>
</svg>